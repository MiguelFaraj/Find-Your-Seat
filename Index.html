<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Miguel & Olivia</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root{
    --gold:#d4af37;
    --glass:rgba(255,255,255,0.12);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Montserrat',sans-serif;
}

body{
    background:
    linear-gradient(
        rgba(0,0,0,.35),
        rgba(0,0,0,.55)
    ),
    url("https://images.unsplash.com/photo-1511285560929-80b456fea0bc?q=80&w=1920")
    center center/cover no-repeat;

    color:white;
}

.page{
    position:absolute;
    inset:0;
    padding:40px 25px 110px;
    overflow-y:auto;

    display:none;
    animation:fade .4s ease;
}

.page.active{
    display:block;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.hero{
    min-height:80vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.monogram{
    width:90px;
    height:90px;

    border:2px solid rgba(255,255,255,.5);
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:25px;

    backdrop-filter:blur(10px);
}

.monogram span{
    font-size:32px;
    font-family:'Playfair Display',serif;
}

h1{
    font-family:'Playfair Display',serif;
    font-size:3.2rem;
    line-height:1.1;
    margin-bottom:15px;
}

.subtitle{
    max-width:320px;
    line-height:1.7;
    opacity:.9;
}

.card{
    backdrop-filter:blur(18px);
    background:var(--glass);

    border:1px solid rgba(255,255,255,.15);

    border-radius:28px;
    padding:25px;
}

.section-title{
    font-family:'Playfair Display',serif;
    font-size:2rem;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:16px;

    border:none;
    border-radius:15px;

    font-size:16px;
    outline:none;
}

.search-btn{
    width:100%;
    margin-top:12px;
    padding:16px;

    border:none;
    border-radius:15px;

    background:var(--gold);
    color:white;

    font-size:16px;
    cursor:pointer;
}

.result{
    margin-top:25px;
    text-align:center;
    font-size:18px;
}

.result strong{
    color:#ffd86b;
}

iframe{
    width:100%;
    height:70vh;

    border:none;
    border-radius:20px;

    background:white;
}

.photo-card{
    text-align:center;
}

.photo-card p{
    margin:20px 0;
    line-height:1.8;
}

.upload-btn{
    display:inline-block;

    background:var(--gold);
    color:white;

    text-decoration:none;

    padding:15px 25px;
    border-radius:15px;
}

.bottom-nav{

    position:fixed;

    bottom:15px;
    left:50%;

    transform:translateX(-50%);

    width:92%;
    height:75px;

    border-radius:24px;

    backdrop-filter:blur(20px);

    background:rgba(255,255,255,.12);

    border:1px solid rgba(255,255,255,.15);

    display:flex;
    justify-content:space-around;
    align-items:center;

    z-index:9999;
}

.nav-btn{

    background:none;
    border:none;

    color:white;

    cursor:pointer;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:3px;

    font-size:12px;
}

.nav-btn .icon{
    font-size:24px;
}

@media(max-width:480px){

h1{
    font-size:2.5rem;
}

.section-title{
    font-size:1.7rem;
}

}

</style>
</head>
<body>

<!-- HOME -->

<section id="home" class="page active">

    <div class="hero">

        <div class="monogram">
            <span>M&O</span>
        </div>

        <h1>
            Miguel<br>
            & Olivia
        </h1>

        <p class="subtitle">
            Together with their families, invite you to celebrate their wedding and share this unforgettable day.
        </p>

    </div>

</section>

<!-- SEAT -->

<section id="seat" class="page">

    <div class="card">

        <h2 class="section-title">
            Find Your Seat
        </h2>

        <input
            id="guestName"
            type="text"
            placeholder="Enter your full name">

        <button
            class="search-btn"
            onclick="findSeat()">
            Search
        </button>

        <div id="seatResult" class="result"></div>

    </div>

</section>

<!-- FLOOR PLAN -->

<section id="plan" class="page">

    <div class="card">

        <h2 class="section-title">
            Floor Plan
        </h2>

        <iframe src="floorplan.pdf"></iframe>

    </div>

</section>

<!-- PHOTOS -->

<section id="photos" class="page">

    <div class="card photo-card">

        <h2 class="section-title">
            Share Your Memories
        </h2>

        <p>
            Upload your wedding photos and videos in their original quality so everyone can relive the special moments.
        </p>

        <a
            class="upload-btn"
            href="YOUR_UPLOAD_LINK"
            target="_blank">
            Upload Photos
        </a>

    </div>

</section>

<!-- NAVIGATION -->

<nav class="bottom-nav">

    <button class="nav-btn" onclick="showPage('seat')">
        <span class="icon">🪑</span>
        Seat
    </button>

    <button class="nav-btn" onclick="showPage('home')">
        <span class="icon">💍</span>
        Home
    </button>

    <button class="nav-btn" onclick="showPage('plan')">
        <span class="icon">🗺️</span>
        Plan
    </button>

    <button class="nav-btn" onclick="showPage('photos')">
        <span class="icon">📸</span>
        Photos
    </button>

</nav>

<script>

function showPage(page){

    document
        .querySelectorAll(".page")
        .forEach(p=>p.classList.remove("active"));

    document
        .getElementById(page)
        .classList.add("active");
}

/*
Replace with Google Sheet data
*/

const guests = [

    {
        name:"Miguel Faraj",
        table:"Table 1"
    },

    {
        name:"Olivia Smith",
        table:"Table 5"
    },

    {
        name:"John Doe",
        table:"Table 12"
    }

];

function findSeat(){

    const search =
        document
        .getElementById("guestName")
        .value
        .trim()
        .toLowerCase();

    const guest =
        guests.find(
            x=>x.name.toLowerCase()===search
        );

    const result =
        document.getElementById("seatResult");

    if(guest){

        result.innerHTML =
        `
        <strong>${guest.name}</strong>
        <br><br>
        You are seated at
        <br>
        <strong>${guest.table}</strong>
        `;

    }else{

        result.innerHTML =
        "Guest not found.";

    }
}

</script>

</body>
</html>
